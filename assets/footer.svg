        <circle r="25" fill="#3a322c" stroke="#6b6156"/><circle r="9" fill="#15171a"/>
        <g stroke="#6b6156" stroke-width="4" stroke-linecap="round"><path d="M0 -24 L0 -11" transform="rotate(0)"/><path d="M0 -24 L0 -11" transform="rotate(60)"/><path d="M0 -24 L0 -11" transform="rotate(120)"/><path d="M0 -24 L0 -11" transform="rotate(180)"/><path d="M0 -24 L0 -11" transform="rotate(240)"/><path d="M0 -24 L0 -11" transform="rotate(300)"/></g></g>
    </g>
  <g font-family="'Courier New', Courier, monospace" text-anchor="middle">
    <text x="600" y="54" font-size="13" letter-spacing="4" fill="#6f776a">FIN DE LA CARA A</text>
    <text x="600" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" letter-spacing="3" fill="#c9c2b0">dale la vuelta a la cinta ↻</text>
    <text x="600" y="124" font-size="12" fill="#6f776a">◂◂ rebobinar &#160;·&#160; ▶ volver a empezar &#160;·&#160; ■ side B abajo</text>
