  <rect x="1" y="1" width="1198" height="142" rx="13" fill="none" stroke="#2c322c"/>

  <rect x="60" y="68" width="1080" height="4" fill="#2c322c"/>
  <rect x="60" y="68" width="1080" height="4" fill="#4a382c" opacity="0.8"/>
  
