<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Frontend-ClinicaBiometrica">
  <title>Frontend-ClinicaBiometrica — Nakusu</title>
  <defs>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" fill="#6b7f52" opacity="0.16"/>
      <rect x="4" y="3" width="1" height="1" fill="#8a8f8a" opacity="0.10"/>
      <rect x="2" y="5" width="1" height="1" fill="#7b4b3b" opacity="0.10"/>
    </pattern>
    <pattern id="lines" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 6 L6 0" stroke="#8a7f68" stroke-width="0.6" opacity="0.18"/>
    </pattern>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4038"/><stop offset="55%" stop-color="#3a322c"/><stop offset="100%" stop-color="#2b2521"/>
    </linearGradient>
    <linearGradient id="label" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e3dbc8"/><stop offset="100%" stop-color="#cfc5ae"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1d201e" stop-opacity="0"/><stop offset="100%" stop-color="#0b0d0c" stop-opacity="0.85"/>
    </radialGradient>
    <clipPath id="win"><rect x="0" y="0" width="200" height="40" rx="5"/></clipPath>
  </defs>
  <rect width="1200" height="300" rx="14" fill="#15171a"/>
  <rect width="1200" height="300" rx="14" fill="url(#grain)"/>
  <rect width="1200" height="300" rx="14" fill="url(#vig)"/>
  
  <g transform="translate(330 150) scale(1.0) rotate(-1.3)">
