    <rect x="82.0" y="-54.0" width="1" height="30" fill="#a89c86" opacity="0.6"/>
    <g font-family="'Courier New', Courier, monospace" font-size="11" fill="#7a7263"><text x="92.0" y="-44.0">03a frontend</text><text x="92.0" y="-29.0">03b backend</text></g>
    <g transform="translate(-100.0 30.0)">
