    <text y="42" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#e3dbc8">Frontend-ClinicaBiometrica</text>
    <text y="80" font-family="'Courier New', Courier, monospace" font-size="14" fill="#a89c86">Telemedicina con login facial, citas</text>
