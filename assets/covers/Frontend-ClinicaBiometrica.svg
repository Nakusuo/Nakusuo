    <g fill="#574f46"><circle cx="-262.0" cy="-82.0" r="3"/><circle cx="262.0" cy="-82.0" r="3"/><circle cx="-262.0" cy="82.0" r="3"/><circle cx="262.0" cy="82.0" r="3"/></g>
