    <g transform="translate(0 124)"><rect x="0" y="0" width="92" height="24" rx="12" fill="#1c1f1c" stroke="#4a5347"/><text x="46" y="16" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#c9c2b0">Angular 16</text><rect x="100.0" y="0" width="76" height="24" rx="12" fill="#1c1f1c" stroke="#4a5347"/><text x="138" y="16" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#c9c2b0">Material</text><rect x="184.4" y="0" width="61" height="24" rx="12" fill="#1c1f1c" stroke="#4a5347"/><text x="215" y="16" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#c9c2b0">WebRTC</text></g>
  </g>
  <g transform="translate(1060 24)">
    <circle cx="8" cy="8" r="6" fill="#c9505f"><animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="22" y="13" font-family="'Courier New', Courier, monospace" font-size="12" letter-spacing="2" fill="#a89c86">PLAY ▶</text>
