    <rect x="-256.0" y="-80.0" width="512" height="22" rx="4" fill="#4a382c"/>
    <rect x="-256.0" y="-64.0" width="512" height="6" fill="#4a382c"/>
    <text x="-244.0" y="-64.0" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="700" letter-spacing="3" fill="#e6e0d0">SIDE A · TRACK 03a</text>
    <text x="244.0" y="-64.0" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11" letter-spacing="2" fill="#e6e0d0" opacity="0.75">C-90 · NAKUSU</text>
    <text x="-240.0" y="-18.0" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" letter-spacing="3" fill="#2b2f2a">CLÍNICA</text>
    <rect x="-238.0" y="-10.0" width="0" height="3" fill="#7b2d3b">
